{% extends "base.html" %}
{% block title %}Event Log{% endblock %}
{% block head_extra %}
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
{% endblock %}

{% block content %}
<section class="card">
  <h2>Event History</h2>
  <table class="event-table" id="event-table">
    <thead>
      <tr>
        <th>Timestamp</th>
        <th>Risk Level</th>
        <th>Track</th>
        <th>Reasons</th>
        <th>Snapshot</th>
        <th>Map</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</section>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/axios@1.6.1/dist/axios.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', path='js/main.js') }}"></script>
<script src="{{ url_for('static', path='js/map.js') }}"></script>
{% endblock %}
